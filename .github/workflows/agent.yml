name: Achievements Farm

on:
  schedule:
    # Requested every 3 minutes. Note: GitHub Actions cron is throttled to
    # a minimum of ~5 minutes between runs, so effective frequency is ~5 min.
    - cron: "*/3 * * * *"
  workflow_dispatch:

concurrency:
  group: achievements-farm
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      # gh CLI on Actions runners is auto-authenticated via GH_TOKEN. We point it
      # at a PAT (if provided) so contributions are attributed to the user; otherwise
      # it falls back to the runner's default github.token.
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
    steps:
      - name: Resolve token
        id: token
        run: |
          if [ -n "${{ secrets.PAT_TOKEN }}" ]; then
            echo "token=${{ secrets.PAT_TOKEN }}" >> "$GITHUB_OUTPUT"
            echo "::notice::Using PAT_TOKEN — achievements will be credited to your user."
          else
            echo "::warning::PAT_TOKEN secret not set; using GITHUB_TOKEN. Achievements will NOT be credited to your user (attributed to github-actions[bot])."
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "${{ vars.GH_USER_NAME  || github.repository_owner }}"
          git config user.email "${{ vars.GH_USER_EMAIL || format('{0}@users.noreply.github.com', github.repository_owner) }}"

      - name: Farm achievements
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          COAUTHOR_NAME: ${{ vars.COAUTHOR_NAME }}
          COAUTHOR_EMAIL: ${{ vars.COAUTHOR_EMAIL }}
        run: |
          set -euo pipefail
          ts="$(date -u +%s)"
          branch="chore/achievements-${ts}"
          marker="timestamp_${ts}"

          auth="Authorization: Bearer ${GH_TOKEN}"
          api="https://api.github.com/repos/${REPO}"
          accept="Accept: application/vnd.github+json"

          # Use the token explicitly for push (avoids credential-helper prompt issues).
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          # ---- Pull Shark + YOLO: open & merge a trivial PR ----
          git checkout -b "${branch}"
          mkdir -p .achievements
          printf '%s\n' "${marker}" > ".achievements/${marker}"
          git add ".achievements/${marker}"
          commit_msg="chore: achievement run ${ts}"
          if [ -n "${COAUTHOR_NAME}" ] && [ -n "${COAUTHOR_EMAIL}" ]; then
            git commit -m "${commit_msg}" \
              -m "Co-authored-by: ${COAUTHOR_NAME} <${COAUTHOR_EMAIL}>"
          else
            git commit -m "${commit_msg}"
          fi
          git push --set-upstream origin "${branch}" --force-with-lease

          pr_num="$(curl -s -o /tmp/pr.json -w '%{http_code}' -X POST -H "${auth}" -H "${accept}" -H "Content-Type: application/json" \
            "${api}/pulls" \
            -d "{\"title\":\"chore: achievement run ${ts}\",\"head\":\"${branch}\",\"base\":\"${DEFAULT_BRANCH}\",\"body\":\"Auto-generated PR for achievement runs.\"}")"
          echo "PR create HTTP ${pr_num}; response:"
          python3 -c "import json; d=json.load(open('/tmp/pr.json')); print('  number=',d.get('number'),'message=',d.get('message'),'errors=',d.get('errors'))"
          test "${pr_num}" = "201"
          pr_num="$(python3 -c "import json; print(json.load(open('/tmp/pr.json'))['number'])")"
          echo "opened PR #${pr_num}"

          merge_status="$(curl -s -o /tmp/merge.json -w '%{http_code}' -X PUT -H "${auth}" -H "${accept}" -H "Content-Type: application/json" \
            "${api}/pulls/${pr_num}/merge" \
            -d "{\"merge_method\":\"squash\",\"commit_title\":\"chore: achievement run ${ts} (#${pr_num})\"}")"
          python3 -c "import json; d=json.load(open('/tmp/merge.json')); ok=d.get('merged') or d.get('message'); print(f'merge HTTP ${merge_status}: {ok}')"
          test "${merge_status}" = "200"

          # ---- Quickdraw: open & close an issue within 5 minutes ----
          issue_num="$(curl -s -X POST -H "${auth}" -H "${accept}" -H "Content-Type: application/json" \
            "${api}/issues" \
            -d "{\"title\":\"run ${ts}\",\"body\":\"Auto-generated for Quickdraw.\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['number'])")"
          curl -s -X PATCH -H "${auth}" -H "${accept}" -H "Content-Type: application/json" \
            "${api}/issues/${issue_num}" -d '{"state":"closed"}' >/dev/null
          echo "opened & closed issue #${issue_num}"

      - name: Summary
        if: always()
        run: echo "Achievement run done at $(date -u)."
